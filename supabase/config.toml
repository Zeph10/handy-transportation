# Supabase CLI configuration (local development stack and function settings).
# Production Auth/SMTP settings are configured in the Supabase dashboard; see docs/SETUP.md.
project_id = "handy-transportation"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Local email inbox for magic links: http://localhost:54324
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true
max_frequency = "60s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Your Handy Transportation login link"
content_path = "./templates/magic_link.html"

# Cloudflare Turnstile protects the login form from scripted abuse.
# Enabled in production via the dashboard (Authentication → Attack Protection).
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET_KEY)"

[edge_runtime]
enabled = true
policy = "per_worker"

# Every function checks the caller itself (admin session via /auth/v1/user,
# cron shared secret, or OAuth state), so gateway JWT checks are off. This also
# keeps them working with Supabase's newer asymmetric JWT signing keys.
[functions.google-oauth-start]
verify_jwt = false

[functions.google-calendars]
verify_jwt = false

[functions.calendar-sync]
verify_jwt = false

# Google redirects here without a Supabase session.
[functions.google-oauth-callback]
verify_jwt = false

# Called by pg_cron with a shared secret, or by an admin (checked inside the function).
[functions.send-notifications]
verify_jwt = false
