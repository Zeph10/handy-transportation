name: Deploy Edge Functions

# Run manually from GitHub → Actions → "Deploy Edge Functions" → Run workflow.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN
# (supabase.com → Account → Access Tokens). The project ref is not secret.
# Function secrets (Google client ID, Resend key, …) are set separately in
# Supabase → Edge Functions → Secrets.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: feigehkxvepsaeiabpca

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Edge Function copy of core is current
        run: node scripts/sync-core.mjs --check

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e -u   # GitHub runs bash with -e; we handle failures ourselves to report them.
          fail() { msg="$(sed 's/\x1b\[[0-9;]*m//g' "$1" | tr -d '\r' | tr '\n' ' ' | sed 's/%/%25/g' | tail -c 900)"; echo "::error title=$2::$msg"; exit 1; }
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error title=Missing secret::Add the SUPABASE_ACCESS_TOKEN repository secret first"; exit 1; fi
          # verify_jwt settings come from supabase/config.toml.
          for fn in google-oauth-start google-oauth-callback google-calendars calendar-sync send-notifications; do
            echo "Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api > out.txt 2>&1
            status=$?; cat out.txt
            [ $status -eq 0 ] || fail out.txt "Deploy $fn failed"
            echo "::notice title=Deployed::$fn"
          done
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
